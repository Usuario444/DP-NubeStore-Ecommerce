# =====================================================================
# NubeStore - Configuración (Avance 1)
# =====================================================================
spring.application.name=nubestore-backend
server.port=8080

# No exponer detalles internos en las respuestas de error por defecto
server.error.include-stacktrace=never
server.error.include-message=never

# ---------------------------------------------------------------------
# Conexión JDBC (leída por ConexionBD, NO por Spring).
# ---------------------------------------------------------------------
nubestore.db.url=jdbc:postgresql://localhost:5432/nubestore_db
nubestore.db.username=postgres
nubestore.db.password=paul3301

# ---------------------------------------------------------------------
# CORS (orígenes del frontend separados por coma)
# ---------------------------------------------------------------------
nubestore.cors.allowed-origins=http://localhost:63342,http://127.0.0.1:63342