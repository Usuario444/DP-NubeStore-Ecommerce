<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - NubeStore</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        .admin-login-body {
            background-color: var(--color-bg-alt);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .admin-login-card {
            background-color: var(--color-bg);
            padding: 3rem;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 4px solid var(--color-primary);
        }
        .admin-logo {
            width: 80px;
            margin-bottom: 1rem;
            border-radius: var(--radius-md);
        }
        .admin-title {
            font-family: var(--font-heading);
            color: var(--color-text);
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }
    </style>
</head>
<body class="admin-login-body">
    <div id="toast-container" class="toast-container"></div>

    <div class="admin-login-card">
        <img src="assets/logo.jpg" alt="Logo NubeStore" class="admin-logo">
        <h1 class="admin-title">Panel de Vendedor</h1>
        <form id="form-login-admin" class="auth-form">
            <div class="form-group">
                <label for="login-email">Correo Electrónico Institucional</label>
                <input type="email" id="login-email" required placeholder="ventas@nubestore.pe">
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Ingresar al Sistema</button>
        </form>
    </div>

    <script type="module" src="js/pages/login-admin.js"></script>
</body>
</html>
